[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facematch"
version = "0.1.0"
description = "Find photos of specific people inside an image repository, fully offline."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "FaceMatch contributors" }]
keywords = ["face-recognition", "photo-search", "face-matching", "offline"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "face_recognition>=1.3.0",
    "numpy>=1.21",
    "Pillow>=9.0",
    "gdown>=5.0",
    "tqdm>=4.64",
]

[project.optional-dependencies]
web = ["Flask>=2.2"]
dev = ["pytest>=7.0", "Flask>=2.2"]

[project.scripts]
facematch = "facematch.cli:main"
facematch-web = "facematch.webapp:main"

[project.urls]
Homepage = "https://github.com/rajarshi-2000/FaceMatch"
Issues = "https://github.com/rajarshi-2000/FaceMatch/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facematch = ["templates/*.html", "static/*.css"]
